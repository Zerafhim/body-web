services:
  - type: web
    name: raga-app
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn body:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: raga-db
          property: connectionString

databases:
  - name: raga-db
    databaseName: raga
    user: raga
    plan: free
    region: oregon
